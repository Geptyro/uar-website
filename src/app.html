<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		%sveltekit.head%
		<script>
			// The theme picked on /account, applied before the first paint —
			// anything later and the page flashes the other palette. No choice
			// stored means the root keeps "color-scheme: light dark" and follows
			// the device.
			try {
				var t = localStorage.getItem('uar:theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Umami (self-hosted at stats.cedricdessalles.dev, cookieless, first-party;
		     tracker renamed to insights.js to stay off adblock lists). SPA
		     navigations are auto-tracked. -->
		<script
			defer
			src="https://stats.cedricdessalles.dev/insights.js"
			data-website-id="26805153-0055-4d03-8219-fbe7f2b5a6ad"
			data-domains="uar.cedricdessalles.dev"
		></script>
	</body>
</html>
