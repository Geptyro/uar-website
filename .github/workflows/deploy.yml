name: Deploy

# Deploys the private Fly app `uar-website` on a version tag (vX.Y.Z).
# Pushing to main does NOT deploy — `npm run release vX.Y.Z` cuts and
# pushes the tag. The verify job re-runs full CI on the tagged commit and
# the deploy only starts if it passes, so a tag can never ship a broken
# tree (v0.5.1/v0.5.3 both did, when tags raced CI).
#
# Deploy logic lives in the shared template Geptyro/github-workflows.
# bootstrap: true — the template idempotently creates the app + private
# Flycast IP on first run, so there is no manual `fly launch` step.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: deploy-uar-website
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    uses: Geptyro/github-workflows/.github/workflows/fly-deploy.yml@main
    with:
      app: uar-website
      bootstrap: true
      # Repo secrets forwarded to the Fly app, by name — the values live only
      # in GitHub's secret store and never in this file.
      #
      # Migration in progress: the older APP_SECRETS blob below still carries
      # MONGODB_URI, AUTH_SECRET and the Battle.net credentials. Both sources
      # merge into one `flyctl secrets import`, so keys can move up here one at
      # a time. Nothing forces the pace — the blob is write-only, so moving a
      # key means having its value to hand.
      #
      # Tigris credentials (AWS_*, BUCKET_NAME) are deliberately absent: those
      # were set on the app by `fly storage create` and are not repo secrets.
      app-secrets: |
        VAPID_PUBLIC_KEY
        VAPID_PRIVATE_KEY
        VAPID_SUBJECT
        SITE_ADMINS
    # required by app-secrets: a reusable workflow cannot read a secret it was
    # not told the name of. It hands the template every secret in this repo,
    # and the allowlist above governs which of them reach Fly.
    secrets: inherit
