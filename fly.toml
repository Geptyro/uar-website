# Private backend app: UAR (Undead Assault Reborn) unit database — prerendered
# pages served by a small node server (adapter-node) that also hosts the
# replay upload API. No public IP (the deploy workflow's bootstrap creates the
# app with a private Flycast IP) — reachable only as uar-website.flycast:80
# from the cdd-gateway, which terminates TLS and routes
# uar.cedricdessalles.dev here.

app = 'uar-website'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  # rate limiting must see the real client IP forwarded by the cdd-gateway
  ADDRESS_HEADER = 'x-forwarded-for'
  # public origin (the gateway hop is plain HTTP) — keeps url.origin, and thus
  # the Battle.net OAuth redirect_uri, on the real domain
  ORIGIN = 'https://uar.cedricdessalles.dev'
  # replay uploads are up to ~16MB; adapter-node defaults to 512K
  BODY_SIZE_LIMIT = '16M'

[http_service]
  internal_port = 8080
  # The gateway already forces HTTPS at the edge; no point redirecting again on
  # the private hop (and a redirect here would break the plain-HTTP proxy).
  force_https = false
  # Always-on like the other backends: Flycast does not reliably wake a fully
  # idled machine on a proxied request.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/'

# 512mb: replay uploads are parsed in-process (bzip2 decompression + full
# game-event decode of ~10MB replays spikes well past what 256mb allows).
[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
